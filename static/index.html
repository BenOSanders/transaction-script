        function loadTransactions() {
            fetch("/api/transactions")
            .then(r => r.json())
            .then(data => {
                data.forEach(tx => {
                    gridOptions.rowData.push(
                        {
                            "amount": tx.amount,
                            "description": tx.description,
                            "date": tx.date,
                            "merchant": tx.merchant_name,
                            "category": tx.category,
                            "address": tx.address,
                            "zipcode": tx.zipcode,
                            "pending": tx.pending,
                            "notes": tx.notes
                        }
                    )
                })
                agGrid.createGrid(myGridElement, gridOptions);

            })
        }

        function loadAccounts() {
            fetch("/api/accounts")
            .then(r => r.json())
            .then(data => {
                const tableBody = document.getElementById("acc-body");
                data.forEach(acc => {
                    tableBody.innerHTML += `
                    <tr>
                        <td>${acc.account_name}</td>
                        <td>$${acc.balance}</td>
                        <td>${acc.account_type}</td>
                    </tr>`;
                })
            })
        }

        function sync() {
            fetch("/api/sync", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            }).then(() => loadTransactions())
        }

        let handler = null;

        async function link() {
            res = await fetch('/api/link', { method: 'POST' });
            const { link_token } = await res.json();
            handler = Plaid.create({
                token: link_token["link_token"],
                onSuccess: async (public_token, metadata) => {
                    await fetch('/api/connect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ public_token })
                    });
                    console.log("Link successful")
                    loadAccounts()
                },
                onExit: (err, metadata) => {
                    if (err) console.log("Plaid link error:", err)
                },
            });
        }

        document.getElementById('link-btn').addEventListener('click', () => {
            if (handler) {
                handler.open()
            } else {
                console.error('Plaid not initialized yet.');
            }
        });

        // AG GRID
        //import { themeBalham } from 'ag-grid-community';

        // Grid Options: Contains all of the Data Grid configurations
        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "amount" },
                { field: "description" },
                { field: "date" },
                { field: "merchant" },
                { field: "category" },
                { field: "address" },
                { field: "zipcode" },
                { field: "pending" },
                { field: "notes" }
            ]
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#myGrid');
        //agGrid.createGrid(myGridElement, gridOptions);

        link();
        loadTransactions();
        loadAccounts();

    </script>
