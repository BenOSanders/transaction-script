<!DOCTYPE html>

<html>
    <head>
        <title>Home Budget</title>
          <style>
            body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
            table { width: 100%; border-collapse: collapse; }
            th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
            th { background: #f5f5f5; }
            #chat-box { margin-top: 40px; }
            #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; }
            #chat-input { width: 80%; padding: 8px; }
        </style>
    </head>
    <body>
        <h2>Transactions</h2>
        <button onclick="sync()">Sync</button>
        <button onclick="link()">Link</button>
        <table id="tx-table">
            <thead><tr><th>Amount</th><th>Description</th><th>Date</th><th>Merchant Name</th><th>Category</th><th>Address</th><th>Zipcode</th><th>Pending</th><th>Notes</th></tr></thead>
            <tbody id="tx-body"></tbody>
        </table>

        <div id="chat-box">
            <h2>Ask about your finances</h2>
            <div id="messages"></div>
            <input id="chat-input" placeholder="e.g. How much did I spend on food last month?" />
            <button onclick="sendMessage()">Send</button>
        </div>

    </body>
    <script>
        loadTransaction()

        function loadTransaction() {
            fetch("/api/transactions")
            .then(r => r.json())
            .then(data => {
                const tableBody = document.getElementById("tx-body");
                data.transactions.forEach(tx => {
                    tableBody.innerHTML += `
                    <tr>
                    <td>${tx.amount.toFixed(2)}</td>
                    <td>${tx.description}</td>
                    <td>$${tx.date}</td>
                    <td>$${tx.merchant_name}</td>
                    <td>${tx.category ?? "—"}</td>
                    <td>$${tx.address}</td>
                    <td>$${tx.zipcode}</td>
                    <td>${tx.pending}</td>
                    <td>${tx.notes}</td>
                    </tr>`;
                });
            })
        }

        function sync() {
            fetch("/api/sync", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            }).then(() => loadTransaction())
        } 

        function link() {
            fetch("/api/link", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            .then(r => r.json())
            .then(res => window.location.href = res.hosted_link_url)
            .then(res => {
                fetch("/api/import-new-items", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                })
            })
        }
    </script>
</html>
